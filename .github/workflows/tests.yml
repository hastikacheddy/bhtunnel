name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * 1"   # weekly full run, catches upstream Qiskit breakage

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-lock.txt && pip install -e ".[dev,quantum]"
      - run: pytest -q -m "not slow"

  full:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-lock.txt && pip install -e ".[dev,quantum]"
      - run: pytest -q
